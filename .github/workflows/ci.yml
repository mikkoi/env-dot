name: CI
on:
  pull_request:
  push:
    branches:
      - '*'
  workflow_dispatch:

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    container:
      image: perldocker/perl-tester:5.42
    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@v6
      - id: run-tests
        name: Run Tests
        env:
          PERL_USE_UNSAFE_INC: 0
          AUTHOR_TESTING: 1
          AUTOMATED_TESTING: 1
          EXTENDED_TESTING: 1
          RELEASE_TESTING: 1
        run: auto-build-and-test-dist
      - id: upload-artifact
        # Upload artifact to a GitHub Actions "storage".
        name: Upload Build
        uses: actions/upload-artifact@v7.0.1
        with:
          name: build_dir
          path: build_dir
  coverage:
    needs: build
    runs-on: ubuntu-latest
    container:
      image: perldocker/perl-tester:5.42
    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@v6
      - id: download-artifact
        # Download the artifact that was uploaded in earlier step.
        name: Download Build
        uses: actions/download-artifact@v8.0.1
        with:
          name: build_dir
          path: .
      - id: install-deps
        name: Install deps
        run: cpan-install-dist-deps
      - id: test
        name: Test
        run: test-dist
        env:
          CODECOV_TOKEN: ${{secrets.CODECOV_TOKEN}}
          COVERALLS_TOKEN: ${{secrets.COVERALLS_REPO_TOKEN}}
  # coverage:
  #   needs: build
  #   runs-on: ubuntu-latest
  #   container:
  #     image: perldocker/perl-tester:5.42
  #   steps:
  #     - id: checkout
  #       name: Checkout
  #       uses: actions/checkout@v6
  #     - id: download-artifact
  #       # Download the artifact that was uploaded in earlier step.
  #       name: Download Build
  #       uses: actions/download-artifact@v8.0.1
  #       with:
  #         name: build_dir
  #         path: .
  #     - id: install-deps
  #       name: Install deps
  #       run: cpan-install-dist-deps
      - id: test-with-junit-xml-output
        name: Test With JUnit XML Output
        run: |
          if [[ ${CODECOV_TOKEN} ]]; then
            # COVERALLS_REPO_TOKEN=$COVERALLS_TOKEN
            # export COVERALLS_REPO_TOKEN
            # cover -report coveralls
            ## 1. Install Codecov CLI
            # 2. Do prove with JUnit formatter
            prove                                                  \
              --formatter TAP::Formatter::JUnit                    \
              --lib                                                \
              --timer                                              \
              --recurse                                            \
              t                                                    \
              >test-results.junit.xml
              # --shuffle                                            \
              # --verbose                                            \
            ## 3. Upload
            # codecov do-upload --report-type test_results \
            #  --file results.junit.xml --handle-no-reports-found
          fi
        shell: bash
        env:
          CODECOV_TOKEN: ${{secrets.CODECOV_TOKEN}}
          # COVERALLS_TOKEN: ${{secrets.COVERALLS_REPO_TOKEN}}
      # - name: Upload test results to Codecov
      #   if: ${{ !cancelled() }}
      #   uses: codecov/test-results-action@v5
      #   with:
      #     token: ${{ secrets.CODECOV_TOKEN }}
      #     report-type: test_results
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          # directory: ./coverage/reports/
          # env_vars: OS,PYTHON
          fail_ci_if_error: true
          # files: ./coverage1.xml,./coverage2.xml,!./cache
          files: ./test-results.junit.xml
          flags: unittests
          name: codecov-umbrella
          report_type: test_results
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true
